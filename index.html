<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SketchTiler</title>

    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
    <!-- using JSZip for exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  </head>
  
  <body>
    <div id="page">
      <div id="app">
        <div id="sketchpad">
          <canvas id="grid-canvas"></canvas>
          <canvas id="sketch-canvas"></canvas>
        </div>
        <div id="buttons">
          <button id="house-button" class="button is-danger">House</button>
          <button id="forest-button" class="button is-success">Forest</button>
          <!-- <button id="fence-button">Fence</button> -->
          <!-- <button id="path-button">Path</button>   -->
          <!-- <button id="straighten-lines-button">Straighten Lines</button> -->
          <span id="normalize">
            <input id="normalize-toggle"
              type="checkbox" 
              class="onoffswitch-checkbox"  
              checked="true"
            />
            Normalize shapes
          </span>
          <button id="undo-button" class="button is-light">Undo</button>
          <button id="redo-button" class="button is-light">Redo</button>
          <button id="generate-button" class="button is-light">Generate</button>
          <button id="clear-button" class="button is-light">Clear</button>
        </div>
        <div id="phaser"></div>
        <div id="export-buttons">
          <button id="export-map-button" class="button is-dark" disabled="true">Export map</button>
          <button id="export-sketch-button" class="button is-dark" disabled="true">Export sketch</button>
        </div>
      </div>
      
      <!-- GPT -->
      <div id="GPT">
        <!-- Markdown pipeline -->
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
        <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css">
        <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>

        <div class="wrap">
          <!-- LEFT: Chat -->
          <div class="card">
            <h2>Chat</h2>
            <div class="row">
              <input id="text" placeholder="Type a message…" />
              <button id="send">Send</button>
            </div>
            <div class="row">
              <input id="img" type="file" accept="image/*">
              <button id="sendImg">Send + Image</button>
            </div>
            <div class="toolbar">
              <div id="tabPreview" class="tab active">Preview</div>
              <div id="tabRaw" class="tab">Raw</div>
              <button id="copyBtn" class="tab">Copy</button>
              <span id="status" class="muted">Ready.</span>
            </div>
            <div id="preview"></div>
            <textarea id="raw" readonly></textarea>

            <h3>Project Memory</h3>
            <div class="row">
              <input id="note" placeholder="Add a project rule…"/>
              <button id="addNote">Save Note</button>
            </div>
            <pre id="memlog" class="muted">(no memory yet)</pre>

            <h3>Attach files</h3>
            <div class="row">
              <input id="files" type="file" multiple />
            </div>
            <div class="row">
              <input id="uploadNote" placeholder="Optional note…"/>
              <button id="uploadBtn">Upload & Memorize</button>
            </div>
            <pre id="filelog" class="muted">(no files yet)</pre>
          </div>

          <!-- RIGHT: Map generator 
          <div class="card">
            <h2>Map Generator</h2>
            <div class="row">
              <textarea id="mapPrompt" placeholder="Describe the map to generate… e.g. '10x8 grass, a 3x3 tree cluster at (2,2), a castle at center'"></textarea>
            </div>
            <div class="row">
              <button id="loadTileset">Load Tileset</button>
              <button id="genMap">Generate Map</button>
            </div>
            <canvas id="mapCanvas" width="640" height="480"></canvas>
            <div class="small" id="mapInfo"></div>
          </div>
          -->
        </div>

      </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
